name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.4'
      - name: Check secrets
        run: make security
      - name: Test
        run: make test
      - name: Build application
        run: make build
