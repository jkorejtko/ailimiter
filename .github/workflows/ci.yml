name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Package.swift requires Swift 6.4, which ships with Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check secrets
        run: make security
      - name: Test
        run: make test
      - name: Build application
        run: make build
        env:
          ARCH: arm64
